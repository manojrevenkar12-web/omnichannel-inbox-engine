name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (Kotlin, Quarkus, PostgreSQL)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, Quarkus tests and fault drills
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Annotate errors and drill results
        if: always()
        run: python3 ../scripts/ci_annotate.py build.log build/drills
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reports
          path: |
            core/build/reports/tests
            core/build/drills

  agent:
    name: agent (Python, LangGraph)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Development set (in-sample)
        run: |
          inbox-agent eval dev > dev.out
          python3 -c "import json;print('::notice title=agent dev set::'+json.load(open('dev.out'))['headline'])"
      - name: Blind first runs
        run: |
          for f in reports/heldout/*/first_run.json; do
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(f'::notice title=agent {d[\"set\"]} ({d[\"status\"]}) first run::'+d['headline'])" "$f"
          done
