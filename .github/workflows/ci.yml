name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (Kotlin, Quarkus, PostgreSQL)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, Quarkus tests and fault drills
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Annotate errors and drill results
        if: always()
        run: python3 ../scripts/ci_annotate.py build.log build/drills
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reports
          path: |
            core/build/reports/tests
            core/build/drills
