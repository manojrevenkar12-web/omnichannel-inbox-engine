# --- datasource: PostgreSQL is the record; transactions are managed in code, not by JTA
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.max-size=20
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/inbox}
%prod.quarkus.datasource.username=${DATABASE_USER:inbox}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:inbox}
quarkus.flyway.migrate-at-start=true

quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CONSOLE_ORIGIN:http://localhost:5173}
quarkus.log.console.json=false

# --- channels
inbox.whatsapp.app-secret=${WHATSAPP_APP_SECRET:dev-app-secret}
inbox.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:dev-verify-token}
inbox.whatsapp.graph-url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com}
inbox.whatsapp.api-version=v23.0
inbox.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:dev-token}
# WhatsApp service (free-form) messages are billed per message from this instant
inbox.whatsapp.service-billed-from=2026-10-01T00:00:00Z
inbox.instagram.app-secret=${INSTAGRAM_APP_SECRET:dev-app-secret}
inbox.sms.auth-token=${SMS_AUTH_TOKEN:dev-sms-token}
inbox.sms.public-url=${SMS_PUBLIC_URL:http://localhost:8080/webhooks/sms}
inbox.sms.api-url=${SMS_API_URL:https://api.twilio.com}
inbox.sms.account-sid=${SMS_ACCOUNT_SID:AC00000000000000000000000000000000}
inbox.email.topic-arn=${EMAIL_TOPIC_ARN:arn:aws:sns:eu-central-1:000000000000:inbound-mail}
inbox.email.secret=${EMAIL_WEBHOOK_SECRET:dev-email-secret}

# --- sending
inbox.sender.pair-spacing=6s
inbox.sender.request-timeout=10s
inbox.sender.ambiguous-wait=60s
inbox.sender.max-attempts=8
inbox.sender.instance=0
inbox.sender.instances=1
inbox.sender.batch=200
inbox.sender.burst-share=0.1

# --- AI agent
inbox.agent.url=${AGENT_URL:http://localhost:8090}
inbox.agent.quiet=4s
inbox.agent.min-confidence=0.6
inbox.agent.max-replies=6
inbox.agent.timeout=20s

# --- workers (switched off in tests, which drive them directly)
inbox.workers.enabled=true
%test.inbox.workers.enabled=false
inbox.demo.seed=${DEMO_SEED:false}
%test.inbox.demo.seed=true
%dev.inbox.demo.seed=true

%test.inbox.sender.pair-spacing=300ms
%test.inbox.sender.request-timeout=800ms
%test.inbox.sender.ambiguous-wait=1500ms
%test.inbox.agent.quiet=200ms
